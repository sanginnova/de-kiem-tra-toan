<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiểm tra 15 phút - Phương trình mũ và logarit</title><style>body{margin:0;background:#eef2f7;color:#172033;font:16px Arial;line-height:1.5}.start{position:fixed;inset:0;background:#132b49;color:white;display:grid;place-items:center;z-index:9}.start.hide{display:none}.card{max-width:620px;padding:40px;text-align:center}.card h1{font-size:38px}.facts{display:flex;justify-content:center;gap:35px}.facts b{display:block;font-size:25px}.btn{padding:14px 28px;border:0;border-radius:9px;background:#f2bd45;font-weight:bold;font-size:17px;cursor:pointer}header{position:sticky;top:0;background:#132b49;color:white;padding:15px;z-index:5}.head,main,.foot{max-width:900px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center}.timer{font:700 20px monospace;color:#f2bd45}.danger{color:#ff6565!important}.q{background:white;margin:15px 0;padding:20px;border-radius:12px;box-shadow:0 3px 12px #0001}.q.correct{border-left:5px solid #2ca66a}.q.wrong{border-left:5px solid #d94b4b}.opt{display:block;border:1px solid #d6dce5;padding:10px;border-radius:8px;margin:8px 0;cursor:pointer}.ex{display:none;background:#f1f4f7;padding:10px;margin-top:8px}.submitted .ex{display:block}.result{display:none;background:white;padding:25px;border-radius:12px;text-align:center}.result.show{display:block}.score{font-size:44px;font-weight:bold;color:#173d63}.bar{position:fixed;bottom:0;left:0;right:0;background:#132b49;color:white;padding:12px;z-index:6}.foot{display:flex;justify-content:space-between;align-items:center}.submit{padding:11px 25px;border:0;border-radius:8px;background:#f2bd45;font-weight:bold;cursor:pointer}@media(max-width:600px){.card h1{font-size:28px}.head{display:block}.foot{display:block;text-align:center}.submit{width:100%;margin-top:8px}}</style></head><body><div class="start" id="start"><div class="card"><div>ĐỀ KIỂM TRA TRẮC NGHIỆM</div><h1>Phương trình mũ và logarit</h1><div class="facts"><span><b>15</b>câu</span><span><b>15:00</b>phút</span><span><b>10</b>điểm</span></div><p>Đồng hồ chỉ bắt đầu khi em nhấn nút.</p><button class="btn" id="begin">▶ BẮT ĐẦU LÀM BÀI</button></div></div><header><div class="head"><b>KIỂM TRA 15 PHÚT — PHƯƠNG TRÌNH MŨ VÀ LOGARIT</b><span class="timer" id="timer">15:00</span></div></header><main><div class="q" style="margin-top:20px"><b>Hướng dẫn:</b> Chọn một đáp án đúng. Hết giờ bài tự động nộp.</div><div id="result" class="result"><b>KẾT QUẢ</b><div class="score"><span id="score">0</span>/10</div><div id="msg"></div></div><div id="quiz"></div></main><div class="bar"><div class="foot"><span id="progress">Đã trả lời: 0/15</span><button class="submit" id="send">NỘP BÀI</button></div></div><script>const qs=[['Nghiệm của $2^x=8$ là?',['$x=2$','$x=3$','$x=4$','$x=8$'],1,'$8=2^3$.'],['Nghiệm của $3^{x-1}=9$ là?',['$x=1$','$x=2$','$x=3$','$x=4$'],2,'$x-1=2$.'],['$5^{2x-1}=1$ có nghiệm?',['$0$','$1/2$','$1$','$2$'],1,'$2x-1=0$.'],['Điều kiện của $\\log_2(x-3)$?',['$x>0$','$x\\ge3$','$x>3$','$x<3$'],2,'Biểu thức log phải dương.'],['$\\log_2 8$ bằng?',['$2$','$3$','$4$','$8$'],1,'$2^3=8$.'],['$\\log_3x=2$ có nghiệm?',['$6$','$8$','$9$','$12$'],2,'$x=3^2=9$.'],['$\\log_2(x-1)=3$ có nghiệm?',['$7$','$8$','$9$','$10$'],2,'$x-1=8$.'],['$4^x=2^{x+2}$ có nghiệm?',['$1$','$2$','$3$','$4$'],1,'$2x=x+2$.'],['$2^x+2^{x+1}=12$ có nghiệm?',['$1$','$2$','$3$','$4$'],1,'$3\\cdot2^x=12$.'],['$\\log_2x+\\log_24=5$ có nghiệm?',['$2$','$4$','$8$','$16$'],2,'$4x=32$.'],['$\\log_3(x+1)=\\log_37$ có nghiệm?',['$5$','$6$','$7$','$8$'],1,'$x+1=7$.'],['Công thức nào đúng?',['$\\log_a(xy)=\\log_ax+\\log_ay$','$\\log_a(x+y)=\\log_ax+\\log_ay$','$\\log_a(x/y)=\\log_ax\\log_ay$','$\\log_ax^2=2+\\log_ax$'],0,'Công thức logarit của tích.'],['$\\log_2(x^2)=4$ có nghiệm?',['$4$','$\\pm4$','$16$','$\\pm16$'],1,'$x^2=16$.'],['$9^x=27$ có nghiệm?',['$1$','$3/2$','$2$','$3$'],1,'$3^{2x}=3^3$.'],['$\\log_2(x-1)+\\log_2(x+1)=3$ có nghiệm?',['$2$','$3$','$\\sqrt{10}$','$-\\sqrt{10}$'],1,'Điều kiện $x>1$, suy ra $x^2=9$.']];let time=900,started=false,done=false,timer;function render(){quiz.innerHTML=qs.map((q,i)=>`<div class="q" id="q${i}"><h3>Câu ${i+1}. ${q[0]}</h3>${q[1].map((a,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> <b>${'ABCD'[j]}.</b> ${a}</label>`).join('')}<div class="ex">Đáp án: <b>${'ABCD'[q[2]]}</b>. ${q[3]}</div></div>`).join('');document.querySelectorAll('input').forEach(x=>x.onchange=progress);if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:'$',right:'$',display:false}]})}function progress(){document.getElementById('progress').textContent=`Đã trả lời: ${document.querySelectorAll('input:checked').length}/15`}function tick(){time--;let m=Math.floor(time/60),s=time%60;timer.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(time<=60)timer.classList.add('danger');if(time<=0)submit(true)}function submit(auto=false){if(done)return;done=true;clearInterval(timerID);let n=0;qs.forEach((q,i)=>{let box=document.getElementById('q'+i),p=box.querySelector('input:checked');box.querySelectorAll('input').forEach(x=>x.disabled=true);if(p&&+p.value===q[2]){n++;box.classList.add('correct')}else box.classList.add('wrong');box.classList.add('submitted')});document.getElementById('score').textContent=(n*10/15).toFixed(2);document.getElementById('msg').textContent=auto?'Hết giờ — bài đã tự động nộp.':`Đúng ${n}/15 câu.`;document.getElementById('result').classList.add('show');document.getElementById('send').disabled=true}begin.onclick=()=>{if(started)return;started=true;start.classList.add('hide');timerID=setInterval(tick,1000)};send.onclick=()=>submit(false);render();</script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script></body></html>
